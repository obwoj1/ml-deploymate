name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          LLM_OFFLINE_MODE: "true"
        # Exit code 5 = no tests collected yet; allow it during scaffolding.
        run: pytest -q || [ $? -eq 5 ]
